name: panda-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-panda_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      POSTGRES_DB: ${DB_NAME:-panda}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      # Pakai DNS host saat build (go mod download); resolver lokal 127.0.0.53 tidak terlihat dari bridge.
      network: host
    env_file: .env
    environment:
      # Di dalam jaringan Compose, DB dicapai lewat nama service, bukan 127.0.0.1.
      DB_HOST: postgres
      DB_PORT: "5432"
      PORT: "8080"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
